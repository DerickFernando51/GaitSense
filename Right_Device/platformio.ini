[env:esp32-c3-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

